name: el-psy-quant-demo

services:
  backend:
    command:
      - el-psy-quant
      - start-local-backend
      - --mode
      - demo
      - --workspace-root
      - /data/workspace
      - --alembic-config
      - /app/alembic.ini
      - --demo-source-root
      - /app/examples/demo_workspace
    environment:
      EL_PSY_QUANT_DEMO_WORKSPACE_ROOT: /data/workspace
      EL_PSY_QUANT_EVIDENCE_ARTIFACT_ROOT: /data/workspace/evidence
      EL_PSY_QUANT_PAPER_ARTIFACT_ROOT: /data/workspace/paper
      EL_PSY_QUANT_PRODUCT_DATABASE_PATH: /data/workspace/product.sqlite3
      EL_PSY_QUANT_RESEARCH_ARTIFACT_ROOT: /data/workspace/research
      EL_PSY_QUANT_WORKSPACE_MODE: demo
    volumes:
      - demo-data:/data

  web:
    environment:
      EL_PSY_QUANT_WORKSPACE_MODE: demo

volumes:
  demo-data:
